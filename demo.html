<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="color.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">🌦️</span>
      <h1>Weather</h1>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">☀️ Light</button>
  </header>

  <section class="search-section">
    <div class="search-row">
      <input type="text" id="cityInput" placeholder="Search for a city...">
      <button id="searchBtn" type="button">Search</button>
    </div>
    <button class="location-btn" id="locationBtn" type="button">
      <span>📍</span> Use My Current Location
    </button>
  </section>

  <section class="recent-section">
    <p class="recent-label" id="recentLabel"></p>
    <div class="recent-cities" id="recentCities"></div>
  </section>

  <div class="status hidden" id="statusText"></div>

  <section class="weather-card" id="weatherCard">
    <div class="weather-main">
      <div>
        <p class="city-name" id="cityName">-</p>
        <p class="condition" id="condition">-</p>
      </div>
      <div class="weather-icon" id="weatherIcon">☀️</div>
    </div>

    <div class="temp-row">
      <span class="temp" id="temp">-</span>
      <span class="feels-like" id="feelsLike">-</span>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <span class="info-icon">💧</span>
        <div>
          <p class="info-label">Humidity</p>
          <p class="info-value" id="humidity">-</p>
        </div>
      </div>
      <div class="info-box">
        <span class="info-icon">💨</span>
        <div>
          <p class="info-label">Wind Speed</p>
          <p class="info-value" id="wind">-</p>
        </div>
      </div>
      <div class="info-box">
        <span class="info-icon">👁️</span>
        <div>
          <p class="info-label">Visibility</p>
          <p class="info-value" id="visibility">-</p>
        </div>
      </div>
      <div class="info-box">
        <span class="info-icon">🌡️</span>
        <div>
          <p class="info-label">Min / Max</p>
          <p class="info-value" id="minMax">-</p>
        </div>
      </div>
    </div>
  </section>

</div>

<script src="javascript.js"></script>

</body>
</html>
